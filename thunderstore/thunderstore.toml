[config]
schemaVersion = "1.2.0"

[package]
namespace = "Gelofrat"
name = "Floppy"
versionNumber = "0.4.1"
description = "Replaces the Ouroboros shop with Floppy, which exchanges a module for a random one of the same rarity."
websiteUrl = "https://github.com/Gelofrat/Floppy"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "../art/thunderstore/icon.png"
readme = "README.md"
outdir = "../release"

[[build.copy]]
source = "../bin/Release/Floppy.dll"
target = "BepInEx/plugins/Floppy/Floppy.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = ["mycopunk"]

[publish.categories]
mycopunk = ["gameplay", "mods", "qol"]
